<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refractive Labs</title>
  <meta name="description" content="Refractive Labs, Inc.">
  <link rel="canonical" href="https://refractivelabs.com/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Refractive Labs">
  <meta property="og:url" content="https://refractivelabs.com/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <div class="stage">
    <figure class="figure" aria-hidden="true">
      <svg viewBox="0 0 800 400" fill="none">
        <!-- slab -->
        <rect class="slab" x="340" y="70" width="120" height="260" rx="2"/>
        <!-- normal (dotted) -->
        <line class="normal" x1="300" y1="180" x2="500" y2="180"/>
        <!-- dispersion fan (faint) -->
        <line class="ray disp r" x1="460" y1="150" x2="770" y2="54"/>
        <line class="ray disp g" x1="460" y1="150" x2="770" y2="61"/>
        <line class="ray disp b" x1="460" y1="150" x2="770" y2="68"/>
        <!-- main beam: in, inside, out -->
        <path class="ray beam" d="M40 265.7 L340 180 L460 150 L770 61.4"/>
      </svg>
    </figure>

    <header class="brand">
      <h1>Refractive Labs</h1>
    </header>
    </div>

    <footer class="foot">
      <span>&copy; <span id="year">2026</span> Refractive Labs, Inc.</span>
    </footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
